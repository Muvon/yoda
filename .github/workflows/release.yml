name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+*'  # Matches version tags like 2.5, 2.6.0
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., 2.6.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        run: echo "version=${{ inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Verify tag matches source version
        run: |
          VERSION=$(cat VERSION)
          if [[ "${{ steps.version.outputs.version }}" != "$VERSION" ]]; then
            echo "Tag '${{ steps.version.outputs.version }}' does not match '$VERSION' in the VERSION file"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.version }}
        run: |
          # checkout leaves a lightweight tag: fetch the annotated one so its changelog becomes the notes
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          gh release create "$TAG" --title "$TAG" --notes-from-tag --verify-tag

  notify-homebrew:
    name: Notify Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch update to homebrew-tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [[ -z "$TAP_GITHUB_TOKEN" ]]; then
            echo "::error::TAP_GITHUB_TOKEN secret is not available to this repository"
            exit 1
          fi
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TAP_GITHUB_TOKEN" \
            https://api.github.com/repos/muvon/homebrew-tap/dispatches \
            -d "{\"event_type\":\"yoda-release\",\"client_payload\":{\"version\":\"${{ needs.release.outputs.version }}\"}}"
