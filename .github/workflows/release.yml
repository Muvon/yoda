name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+*'  # Matches version tags like 2.4, 2.5, 2.5.1
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., 2.5)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        run: echo "version=${{ inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Verify tag matches source version
        run: |
          VERSION=$(grep -oP "YODA_SOURCE_VERSION='\K[^']+" yoda)
          if [[ "${{ steps.version.outputs.version }}" != "$VERSION" ]]; then
            echo "Tag '${{ steps.version.outputs.version }}' does not match YODA_SOURCE_VERSION '$VERSION' in the yoda script"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.version }}" --title "${{ steps.version.outputs.version }}" --generate-notes --verify-tag

  notify-homebrew:
    name: Notify Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch update to homebrew-tap
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.TAP_GITHUB_TOKEN }}" \
            https://api.github.com/repos/muvon/homebrew-tap/dispatches \
            -d "{\"event_type\":\"yoda-release\",\"client_payload\":{\"version\":\"${{ needs.release.outputs.version }}\"}}"
